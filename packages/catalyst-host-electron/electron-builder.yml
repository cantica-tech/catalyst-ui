# Catalyst Studio on the desktop (R6.20): one build per operating system.
# Signing happens only when its credentials are present (the release workflow
# sets them): macOS with a Developer ID certificate and notarization, Windows
# with Azure Trusted Signing after the build; Linux packages are not signed.
appId: com.cantica-tech.catalyst-studio
productName: Catalyst Studio
electronVersion: 30.5.1
copyright: Copyright © 2026 Cantica Tech
directories:
  app: app
  output: release
  buildResources: build
extraResources:
  - from: ../catalyst-studio/dist/web
    to: studio
artifactName: "catalyst-studio-${version}-${os}-${arch}.${ext}"
publish: null
# app/ has no dependencies: everything is bundled into its files
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Development
