name: CI

on:
  pull_request:
  push:
    branches:
      - development

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  catalyst-trace:
    # Every new commit cites an artifact or rule ID of the catalyst deployment,
    # or is marked `chore:`. The criterion is its own (private) repository,
    # named in catalyst.toml: cloned into this job's own catalyst home.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone the criterion (private, read-only deploy key)
        env:
          CRITERION_DEPLOY_KEY: ${{ secrets.CRITERION_DEPLOY_KEY }}
        run: |
          export CATALYST_HOME="$RUNNER_TEMP/catalyst"
          echo "CATALYST_HOME=$CATALYST_HOME" >> "$GITHUB_ENV"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CRITERION_DEPLOY_KEY" > ~/.ssh/criterion
          chmod 600 ~/.ssh/criterion
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          read -r name url branch < <(python3 -c 'import tomllib; d = tomllib.load(open("catalyst.toml", "rb")); print(d["project_name"], d["catalyst_repo_url"], d.get("criterion_branch") or "criterion")')
          GIT_SSH_COMMAND="ssh -i ~/.ssh/criterion -o IdentitiesOnly=yes" \
            git clone -q -b "$branch" "$url" "$CATALYST_HOME/projects/$name/criterion"
          echo "CATALYST_CLI=$CATALYST_HOME/projects/$name/criterion/bin/catalyst.pyz" >> "$GITHUB_ENV"
      - name: catalyst trace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}~1..${{ github.sha }}"
          fi
          python3 "$CATALYST_CLI" trace "$range"
