# catalyst-ui's own operations. Mirrors .github/workflows/ci.yml exactly, so
# `task ci` is what CI runs, runnable locally.
#
# Catalyst-operation dispatch tasks (create-bug, check-rules, sync-framework,
# ...) come from Taskfile.common.yml (deployed from catalyst's
# development-framework/templates/Taskfile.common.template.yml — refreshed
# by /sync-framework, not hand-edited here).

version: "3"

dotenv: [".env"]

vars:
  # Falls back to the macOS app bundle when the `code` shim hasn't been
  # installed on PATH (Command Palette: Shell Command: Install 'code' command
  # in PATH is the permanent fix — this just unblocks tasks in the meantime).
  CODE_BIN:
    sh: command -v code 2>/dev/null || echo "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code"

includes:
  common:
    taskfile: ./Taskfile.common.yml
    flatten: true

tasks:
  install:
    desc: "Install npm workspace dependencies"
    cmds:
      - npm ci

  lint:
    desc: "Lint all workspaces"
    cmds:
      - npm run lint

  format:check:
    desc: "Check formatting across all workspaces"
    cmds:
      - npm run format:check

  typecheck:
    desc: "Type-check all workspaces (tsc --build; also emits output, since every package is composite)"
    cmds:
      - npm run typecheck

  build:
    desc: "Build all workspaces (alias of typecheck: TS project references emit on build)"
    cmds:
      - npm run typecheck

  test:
    desc: "Run tests across all workspaces"
    cmds:
      - npm test

  ci:
    desc: "Run everything CI runs: lint, format:check, typecheck, test"
    cmds:
      - task: lint
      - task: format:check
      - task: typecheck
      - task: test

  build:vscode-extension:
    desc: "Package catalyst-host-vscode into a self-contained .vsix (bundles catalyst-core and the webview script — no monorepo dependency at install time)"
    dir: packages/catalyst-host-vscode
    cmds:
      - npm run package

  install:vscode-extension:
    desc: "Build and install catalyst-host-vscode into the local VS Code (requires the 'code' CLI on PATH — Command Palette: Shell Command: Install 'code' command in PATH)"
    dir: packages/catalyst-host-vscode
    cmds:
      - task: build:vscode-extension
      - "{{.CODE_BIN}} --install-extension catalyst-host-vscode.vsix"

  install:vscode-extension:unsigned:
    desc: "Build and install catalyst-host-vscode into your local VS Code, skipping signature verification for local test builds (one-time sets extensions.verifySignature: false in your real VS Code user settings, since VS Code has no per-install CLI flag for this)"
    dir: packages/catalyst-host-vscode
    cmds:
      - task: build:vscode-extension
      - node scripts/enable-unsigned-install.js
      - "{{.CODE_BIN}} --install-extension catalyst-host-vscode.vsix"

  publish:vscode-extension:
    desc: "Publish catalyst-host-vscode to the VS Code Marketplace, where it gets signed as part of publishing (needs VSCE_PAT set to a real Azure DevOps token scoped Marketplace: Manage for package.json's registered publisher — see marketplace.visualstudio.com/manage)"
    dir: packages/catalyst-host-vscode
    cmds:
      - npm run publish
