# catalyst-ui's own operations. `task ci` runs what CI runs (.github/workflows/ci.yml, plus the
# standards checks of standards.yml through `task lint`), runnable locally.
#
# catalyst never adds to or edits this Taskfile: its commands run from the
# criterion's own Taskfile.common.yml, with `catalyst task <command> -- <args>`.

version: "3"

# dotenv: [".env"]

includes:
  # cantica-tech code standards: `task lint`, `task format`, `task typecheck`, `task standards:sync`,
  # `task standards:check` — from a checkout of the standards repository next to this one (STANDARDS_DIR).
  standards:
    taskfile: '{{.STANDARDS_DIR | default "../standards"}}/Taskfile.standards.yml'
    optional: true
    flatten: true
    excludes: [lint, format, typecheck] # this repository's own lint and typecheck call standards:lint, standards:typecheck

vars:
  # Falls back to the macOS app bundle when the `code` shim hasn't been
  # installed on PATH (Command Palette: Shell Command: Install 'code' command
  # in PATH is the permanent fix — this just unblocks tasks in the meantime).
  CODE_BIN:
    sh: command -v code 2>/dev/null || echo "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code"
  # The Marketplace token: from the macOS keychain item that VSCE_KEYCHAIN_SERVICE / VSCE_KEYCHAIN_ACCOUNT name
  # (set in the publisher's shell), else VSCE_PAT as the environment has it; empty elsewhere (CI, Linux).
  VSCE_PAT:
    sh: |
      if [ -n "${VSCE_KEYCHAIN_SERVICE:-}" ] && [ -n "${VSCE_KEYCHAIN_ACCOUNT:-}" ] && command -v security >/dev/null 2>&1; then
        security find-generic-password -s "$VSCE_KEYCHAIN_SERVICE" -a "$VSCE_KEYCHAIN_ACCOUNT" -w | jq -r '.value'
      else
        printf '%s' "${VSCE_PAT:-}"
      fi

env:
  VSCE_PAT: "{{.VSCE_PAT}}"

tasks:
  install:
    desc: "Install npm workspace dependencies"
    cmds:
      - npm ci

  lint:
    desc: "Lint all workspaces (ESLint), then the cantica-tech standard's other linters (Markdown, YAML, workflows)"
    # Without the standards checkout the include above is skipped (optional), and the standards checks with it:
    # stop here and say so, rather than pass on ESLint alone while CI's Standards job checks more.
    preconditions:
      - sh: test -f "${STANDARDS_DIR:-../standards}/Taskfile.standards.yml"
        msg: >-
          The cantica-tech standards are not checked out at {{.STANDARDS_DIR | default "../standards"}}, so `task lint` cannot run
          the standards checks CI's Standards job runs (Markdown, YAML, workflows). Clone
          git@github.com:cantica-tech/standards.git next to this repository, or set STANDARDS_DIR to its checkout.
    cmds:
      - npm run lint
      - task: standards:lint

  format:check:
    desc: "Check formatting across all workspaces"
    cmds:
      - npm run format:check

  typecheck:
    desc: "Type-check all workspaces (tsc --build; also emits output, since every package is composite)"
    cmds:
      - npm run typecheck

  build:
    desc: "Build all workspaces (alias of typecheck: TS project references emit on build)"
    cmds:
      - npm run typecheck

  test:
    desc: "Run tests across all workspaces"
    cmds:
      - npm test

  ci:
    desc: "Run everything CI runs: lint, format:check, typecheck, test"
    cmds:
      - task: lint
      - task: format:check
      - task: typecheck
      - task: test

  build:vscode-extension:
    desc: "Package catalyst-host-vscode into a self-contained .vsix (bundles catalyst-core and the webview script — no monorepo dependency at install time)"
    dir: packages/catalyst-host-vscode
    cmds:
      - npm run package

  install:vscode-extension:
    desc: "Build and install catalyst-host-vscode into the local VS Code (requires the 'code' CLI on PATH — Command Palette: Shell Command: Install 'code' command in PATH)"
    dir: packages/catalyst-host-vscode
    cmds:
      - task: build:vscode-extension
      - '"{{.CODE_BIN}}" --install-extension catalyst-host-vscode.vsix'

  install:vscode-extension:unsigned:
    desc: "Build and install catalyst-host-vscode into your local VS Code, skipping signature verification for this local test build: sets extensions.verifySignature: false in your VS Code user settings for the install only (VS Code has no per-install CLI flag for it), then puts back what was there"
    dir: packages/catalyst-host-vscode
    cmds:
      - task: build:vscode-extension
      - |
        set -e
        PREVIOUS="$(node scripts/enable-unsigned-install.js set)"
        trap 'node scripts/enable-unsigned-install.js restore "$PREVIOUS"' EXIT
        "{{.CODE_BIN}}" --install-extension catalyst-host-vscode.vsix

  publish:vscode-extension:
    desc: "Publish catalyst-host-vscode to the VS Code Marketplace, where it gets signed as part of publishing (needs VSCE_PAT set to a real Azure DevOps token scoped Marketplace: Manage for package.json's registered publisher — see marketplace.visualstudio.com/manage)"
    dir: packages/catalyst-host-vscode
    cmds:
      - npm run publish

  release:vsix:
    desc: "Package the extension and copy the .vsix, with a manifest.json naming the catalyst kernel versions it works with (package.json catalyst.kernelVersion), into PUBLISH_DIR/catalyst/vsix/v<version>/ (a distribution repository checkout) — no commit, no push"
    requires:
      vars: [PUBLISH_DIR]
    cmds:
      - task: build:vscode-extension
      - node scripts/release-vsix.mjs --publish-dir "{{.PUBLISH_DIR}}"

  release:vsix:publish:
    desc: "Build the .vsix from the release tag of package.json's version (v<version> or <version>; or -- --tag <tag>) in a temporary worktree, copy it with its manifest into PUBLISH_DIR/catalyst/vsix/v<version>/, then commit and push PUBLISH_DIR (default ../cantica-tech, the distribution repository). The manifest's kernelVersion is KERNEL_VERSION (or -- --kernel-version '...'), else package.json's catalyst.kernelVersion. Step 5 of task release:checklist: run it for every release"
    vars:
      PUBLISH_DIR: '{{.PUBLISH_DIR | default "../cantica-tech"}}'
    cmds:
      - node scripts/release-vsix.mjs --publish-dir "{{.PUBLISH_DIR}}" --push {{if .KERNEL_VERSION}}--kernel-version '{{.KERNEL_VERSION}}'{{end}} {{.CLI_ARGS}}

  release:checklist:
    desc: "Print the release checklist for a catalyst UI release (version bump, paired kernel, distribution)"
    silent: true
    cmds:
      - |
        cat <<'CHECKLIST'
        catalyst UI release checklist (in order):
          1. The paired kernel: the kernel this release is tested against is released and in the distribution
             repository. Set packages/catalyst-host-electron/catalyst-version.txt to it, run
             `npm run spec:sync -w catalyst-core -- <catalyst checkout> <tag>`, and raise VERIFIED_KERNEL_VERSION in
             packages/catalyst-core/src/kernel-version.ts to it (a test fails while it is older than
             catalyst-version.txt; the VS Code host offers a kernel sync only up to it).
          2. The version: version.txt, every packages/*/package.json, package-lock.json and catalyst-core's VERSION
             (a test checks they agree).
          3. From a clean build (each packages/*/dist and *.tsbuildinfo removed): `task ci`,
             `npm run build -w catalyst-studio`,
             `npm run spec:check -w catalyst-core`, `task lint`. Push to development; CI green.
          4. development -> main -> release pull requests, then
             `gh release create <version> --title v<version> --target release`.
          5. The distribution repository: `task release:vsix:publish` builds the .vsix from the release tag in a
             temporary worktree and commits and pushes it, with its manifest.json, to
             ../cantica-tech (PUBLISH_DIR=...) catalyst/vsix/v<version>/. Every release, not later.
          (The VS Code Marketplace is separate and only when the owner asks: task publish:vscode-extension:release.)
        CHECKLIST

  publish:vscode-extension:release:
    desc: "Publish catalyst-host-vscode to the Marketplace for a cut release only — refuses unless HEAD is exactly a release tag matching package.json's version, then runs publish:vscode-extension, then leaves a copy of the release's .vsix in cantica-tech (release:vsix:publish; PUBLISH_DIR defaults to ../cantica-tech, KERNEL_VERSION to package.json's catalyst.kernelVersion)"
    dir: packages/catalyst-host-vscode
    vars:
      PUBLISH_DIR: '{{.PUBLISH_DIR | default "../cantica-tech"}}'
      KERNEL_VERSION:
        sh: |
          {{if .KERNEL_VERSION}}echo '{{.KERNEL_VERSION}}'{{else}}node -p "require('./package.json').catalyst?.kernelVersion ?? ''"{{end}}
    cmds:
      - |
        set -e
        TAG="$(git describe --tags --exact-match HEAD 2>/dev/null)" || {
          echo "HEAD is not an exact release tag — cut the release first (tags the release branch), or check out the release tag before publishing." >&2
          exit 1
        }
        PKG_VERSION="$(node -p "require('./package.json').version")"
        if [ "${TAG#v}" != "$PKG_VERSION" ]; then
          echo "Release tag ($TAG) doesn't match package.json version ($PKG_VERSION) — refusing to publish a mismatched build." >&2
          exit 1
        fi
        echo "HEAD is release $TAG, matching package.json — proceeding to publish."
      - task: publish:vscode-extension
      - task: release:vsix:publish
        vars:
          PUBLISH_DIR: "{{.PUBLISH_DIR}}"
          KERNEL_VERSION: "{{.KERNEL_VERSION}}"
